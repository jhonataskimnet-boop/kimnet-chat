<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMNET - Central de Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-matrix { background-color: #0a2540; }
        .bg-matrix-card { background-color: #123258; }
        .border-matrix { border-color: #1e4a7a; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <!-- TELA DE TRIAGEM / INÍCIO DO CHAT -->
    <div id="client-screen" class="flex items-center justify-center min-h-screen p-4 bg-matrix">
        <div class="w-full max-w-md bg-matrix-card border border-matrix rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-blue-600/20 border border-blue-500/30 rounded-2xl flex items-center justify-center text-blue-400 text-2xl">
                    <i class="fa-solid fa-headset"></i>
                </div>
            </div>
            
            <h2 class="text-2xl font-bold text-center mb-1">Central de Atendimento</h2>
            <p class="text-sm text-slate-400 text-center mb-6">Preencha seus dados para conectar ao suporte presencial KIMNET.</p>

            <form id="start-chat-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Nome Completo</label>
                    <input type="text" id="client-name" required placeholder="Ex: Lucas Mendes" 
                           class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">CPF ou Nº do Contrato</label>
                    <input type="text" id="client-document" required placeholder="000.000.000-00" 
                           class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Assunto Desejado</label>
                    <select id="client-subject" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="Suporte Técnico">🛠️ Suporte Técnico (Sem Conexão / Lenta)</option>
                        <option value="Financeiro">💳 Financeiro (2ª Via / Pix)</option>
                        <option value="Comercial">🚀 Planos e Upgrades</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-600/30">
                    <span>Iniciar Chat Agora</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- TELA DE CONVERSA DO CLIENTE -->
    <div id="chat-screen" class="hidden flex flex-col h-screen bg-slate-950">
        <div class="bg-matrix border-b border-matrix p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold">K</div>
                <div>
                    <h3 class="font-bold text-sm">Atendimento KIMNET</h3>
                    <p class="text-xs text-green-400 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Agente Conectado
                    </p>
                </div>
            </div>
            <span id="chat-protocol" class="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-800"></span>
        </div>

        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-900"></div>

        <div class="p-4 bg-matrix border-t border-matrix flex gap-2">
            <input type="text" id="chat-input" placeholder="Digite sua mensagem..." 
                   class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 rounded-lg text-sm font-semibold">Enviar</button>
        </div>
    </div>

    <script>
        // COLE A SUA URL E CHAVE DO SUPABASE ABAIXO:
        const SUPABASE_URL = 'https://SEU_PROJETO.supabase.co';
        const SUPABASE_KEY = 'SUA_CHAVE_ANON_PUBLICA_AQUI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentProtocol = null;

        document.getElementById('start-chat-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('client-name').value;
            const doc = document.getElementById('client-document').value;
            const subject = document.getElementById('client-subject').value;
            currentProtocol = 'PROT-' + Math.floor(10000 + Math.random() * 90000);

            const { error } = await supabase.from('tickets').insert([
                { protocol: currentProtocol, client_name: name, document: doc, subject: subject, status: 'open' }
            ]);

            if (error) {
                alert('Erro ao conectar com o Supabase. Verifique suas credenciais.');
                return;
            }

            document.getElementById('client-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('chat-protocol').innerText = currentProtocol;

            appendMessage('sistema', `Olá, ${name}! Seu atendimento foi iniciado sob o protocolo ${currentProtocol}. Aguarde um instante.`);

            // Escutar respostas do agente em tempo real
            supabase
              .channel('room_' + currentProtocol)
              .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `protocol=eq.${currentProtocol}` }, payload => {
                  if (payload.new.sender === 'agente') {
                      appendMessage('agente', payload.new.message);
                  }
              })
              .subscribe();
        });

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentProtocol) return;

            appendMessage('cliente', text);

            await supabase.from('messages').insert([
                { protocol: currentProtocol, sender: 'cliente', message: text }
            ]);

            input.value = '';
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            
            if (sender === 'sistema') {
                msgDiv.className = 'text-center text-xs text-slate-400 my-2 bg-slate-950/50 py-2 px-4 rounded-lg border border-slate-800';
                msgDiv.innerText = text;
            } else {
                const isClient = sender === 'cliente';
                msgDiv.className = `flex ${isClient ? 'justify-end' : 'justify-start'}`;
                msgDiv.innerHTML = `
                    <div class="max-w-[80%] rounded-xl px-4 py-2.5 text-sm ${isClient ? 'bg-blue-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'}">
                        ${text}
                    </div>
                `;
            }
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
